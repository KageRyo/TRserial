[package]
name = "trserial"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local-first TalesRunner serial code redemption with a persistent per-account queue"
license = "MIT"
repository = "https://github.com/KageRyo/TRserial"

[features]
default = []
discord = ["dep:serenity"]
clipboard = ["dep:arboard"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
notify-rust = "4"
regex = "1"
rpassword = "7"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
thirtyfour = { version = "0.38", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util", "process"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
arboard = { version = "3", optional = true, default-features = false }
serenity = { version = "0.12", optional = true, default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
