name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the draft; GitHub creates it only when the owner publishes the release
        required: true
        default: v0.1.0
  # Validate packaging when this workflow changes; pull requests never create a release.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/desktop-smoke.ps1
      - desktop/installer/**
      - desktop/build.rs
      - desktop/src/mark.rs
permissions:
  contents: read
concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || 'v0.1.0' }}
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches both Cargo package versions
        shell: bash
        run: |
          for manifest in Cargo.toml desktop/Cargo.toml; do
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
            if [ "v$version" != "$TAG" ]; then
              echo "::error file=$manifest::$manifest declares $version but the tag is $TAG"
              exit 1
            fi
          done

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 keeps the glibc baseline at the current LTS.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            rustflags: ""
          # Static CRT so a clean Windows install does not need the VC++ redistributable.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      PACKAGE: trserial-${{ inputs.tag || 'v0.1.0' }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 mesa-vulkan-drivers xvfb xauth dbus-x11 fonts-noto-cjk
      - name: Build CLI and desktop
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo build --locked --release --target "$TARGET"
          cargo build --locked --release --target "$TARGET" -p trserial-desktop
      - name: Linux release smoke test
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: |
          timeout 120 xvfb-run -a dbus-run-session -- \
            "target/$TARGET/release/trserial-desktop" --data-dir "$RUNNER_TEMP/release-smoke" --smoke-test
          "target/$TARGET/release/trserial" --help > /dev/null
      - name: Windows release smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/desktop-smoke.ps1 -Exe "target\$env:TARGET\release\trserial-desktop.exe" -DataDir "$env:RUNNER_TEMP\release-smoke"
          & "target\$env:TARGET\release\trserial.exe" --help > $null
          if ($LASTEXITCODE -ne 0) { throw "CLI failed to start: $LASTEXITCODE" }
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/$PACKAGE" release
          cp "target/$TARGET/release/trserial" "target/$TARGET/release/trserial-desktop" \
            README.md LICENSE config.example.toml "dist/$PACKAGE/"
          tar -C dist -czf "release/$PACKAGE.tar.gz" "$PACKAGE"
      - name: Package Windows archive and portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          $dir = New-Item -ItemType Directory -Path "dist\$env:PACKAGE"
          Copy-Item "target\$env:TARGET\release\trserial.exe", "target\$env:TARGET\release\trserial-desktop.exe", README.md, LICENSE, config.example.toml -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "release\$env:PACKAGE.zip"
          Copy-Item "target\$env:TARGET\release\trserial-desktop.exe" "release\$env:PACKAGE-portable.exe"
      - name: Build and check the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed: $LASTEXITCODE" }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          # build.rs writes the icon it embeds; reuse it for the setup program.
          $icon = Get-ChildItem "target\$env:TARGET\release\build" -Filter trserial.ico -Recurse | Select-Object -First 1
          if (-not $icon) { throw 'Generated icon not found' }
          $setup = "$env:PACKAGE-setup"
          & $iscc.FullName "/DAppVersion=$($env:TAG.Substring(1))" "/DSourceDir=$((Resolve-Path "dist\$env:PACKAGE").Path)" `
            "/DOutputDir=$((Resolve-Path release).Path)" "/DOutputName=$setup" "/DIconFile=$($icon.FullName)" desktop\installer\trserial.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

          # Install for this user, run the installed copy, then uninstall it.
          $app = "$env:RUNNER_TEMP\trserial-install"
          $install = Start-Process "release\$setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$app`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'TRserial.lnk'
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut missing: $shortcut" }
          ./.github/scripts/desktop-smoke.ps1 -Exe "$app\trserial-desktop.exe" -DataDir "$env:RUNNER_TEMP\installed-smoke"
          $remove = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed: $($remove.ExitCode)" }
          # The uninstaller finishes from a temporary copy, so wait for the files to go.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$app\trserial-desktop.exe") -or (Test-Path $shortcut)) {
            if ((Get-Date) -gt $deadline) { throw 'Uninstall left the program or its shortcut behind' }
            Start-Sleep -Seconds 1
          }
          Write-Host 'Installer installed, ran, and uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: release/
          if-no-files-found: error

  draft:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum trserial-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published; refusing to replace its files"
              exit 1
            fi
            # Point the draft at this build so publishing tags the commit the files came from.
            gh release edit "$TAG" --target "$GITHUB_SHA"
            gh release upload "$TAG" trserial-* SHA256SUMS.txt --clobber
          else
            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
              echo "::error::Tag $TAG already exists without a draft release"
              exit 1
            fi
            gh release create "$TAG" trserial-* SHA256SUMS.txt --draft --target "$GITHUB_SHA" \
              --title "TRserial $TAG" --notes "Draft build of $GITHUB_SHA. Release notes pending."
          fi
