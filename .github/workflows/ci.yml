name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-chromedriver: true
      - name: Configure Chrome sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chrome_path=$(readlink -f "$CHROME_BIN")
          sudo tee /etc/apparmor.d/trserial-chrome > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile trserial-chrome "$chrome_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/trserial-chrome
      - name: Configure Chrome sandbox on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $chromeDirectory = Split-Path -Parent $env:CHROME_BIN
          icacls $chromeDirectory /grant '*S-1-15-2-1:(OI)(CI)(RX)' /T
          if ($LASTEXITCODE -ne 0) { throw 'Chrome sandbox permissions could not be configured' }
      - name: Local-only browser integration
        run: cargo test --locked --test browser_flow -- --ignored
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
      - run: cargo build --locked --release
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 mesa-vulkan-drivers xvfb xauth dbus-x11 fonts-noto-cjk
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p trserial-desktop --all-targets --all-features -- -D warnings
      - name: Desktop state and UI tests
        run: cargo test --locked -p trserial-desktop -- --test-threads=1
      - run: cargo build --locked -p trserial-desktop
      - name: Linux native pages and tray lifecycle
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a cargo test --locked -p trserial-desktop --test native_tray -- --ignored
      - name: Windows native pages and safe shutdown
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = (Resolve-Path .\target\debug\trserial-desktop.exe).Path
          $start.Arguments = '--data-dir .trserial\ci-gui --smoke-test'
          $start.UseShellExecute = $false
          $gui = [System.Diagnostics.Process]::Start($start)
          if (-not $gui.WaitForExit(90000)) {
            $gui.Kill($true)
            throw 'Native desktop smoke test timed out'
          }
          $exitCode = $gui.ExitCode
          $gui.Dispose()
          if ($exitCode -ne 0) { throw "Native desktop smoke test failed: $exitCode" }
      - run: cargo build --locked --release -p trserial-desktop
