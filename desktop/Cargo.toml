[package]
name = "trserial-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"
description = "Native desktop interface for TRserial"

[dependencies]
trserial = { path = ".." }
gpui-kit = "=0.9.0"
gpui-tray = { version = "=0.3.0", default-features = false, features = ["gpui-kit", "menu-state"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
fs2 = "0.4"
chrono = "0.4"
directories = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
